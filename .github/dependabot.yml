version: 2
updates:
  # Every ecosystem waits a week after a release before proposing it: most
  # hijacked packages are found and pulled within days of publication.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Toolchain churn is noisy and low risk; runtime dependencies ship to
      # the browser and are reviewed one at a time.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Major versions of the toolchain held on purpose (docs/ARCHITECTURE.md,
    # Toolchain). Minor and patch updates still come. Review these holds in
    # January 2027, then every quarter.
    ignore:
      # TypeScript 7 is the native compiler, which has no public API yet:
      # typescript-eslint's type-aware lint cannot run on it.
      # Review: January 2027.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Vitest 5, with the @vitest/* packages that move with it (coverage-v8
      # among them): its changelog is to be read first, against the coverage
      # floors and the jsdom and fake-indexeddb setup. Review: January 2027.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/*"
        update-types:
          - version-update:semver-major
      # vite-plugin-pwa 2 writes the service worker and the web manifest, so
      # a change there decides what every installed copy updates to: its
      # changelog is to be read first. Review: January 2027.
      - dependency-name: vite-plugin-pwa
        update-types:
          - version-update:semver-major
      # The app, CI and the docs run Node 24, and @types/node follows the
      # runtime: Node 26's types would allow calls Node 24 does not have.
      # Move it with node-version in the workflows.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Playwright 1.64 brings a newer browser build: held by the owner on
      # 1 November 2026 (docs/final-run/decision-plan.md, 5.7), with
      # @playwright/test and playwright kept on the same version.
      # Review: January 2027.
      - dependency-name: "@playwright/test"
        versions:
          - ">= 1.64.0"
      - dependency-name: playwright
        versions:
          - ">= 1.64.0"
      # @axe-core/playwright 4.14 enforces label-content-name-mismatch, which
      # finds controls named apart from their visible words across the app
      # (the header's pills among them). Fix those first, then lift this.
      # Review: January 2027.
      - dependency-name: "@axe-core/playwright"
        versions:
          - ">= 4.14.0"
      # jsdom 30.1 fires <details> toggle itself and computes some
      # backgrounds differently, which nine unit tests were written around.
      # Adapt them, then lift this. Review: January 2027.
      - dependency-name: jsdom
        versions:
          - ">= 30.1.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The Android app's Gradle dependencies, the Play Billing Library among
  # them: Google retires old Billing Library versions on a published schedule.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      # Gradle 9 cannot run the Android Gradle Plugin in use (8.13), which
      # relies on an internal API that Gradle 9.6 removed. The wrapper moves
      # to 9 with AGP 9, once Capacitor supports it. Review: January 2027.
      - dependency-name: gradle-wrapper
        update-types:
          - version-update:semver-major
