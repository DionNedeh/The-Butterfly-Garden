version: 2
updates:
  # Every ecosystem waits a week after a release before proposing it: most
  # hijacked packages are found and pulled within days of publication.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Toolchain churn is noisy and low risk; runtime dependencies ship to
      # the browser and are reviewed one at a time.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The Android app's Gradle dependencies, the Play Billing Library among
  # them: Google retires old Billing Library versions on a published schedule.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
