name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Scoped per ref: a new run only supersedes an earlier run of the same branch
# or pull request. A shared literal group would let any run in the repo cancel
# a main deploy that is already under way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that can reject a change runs here, so a red check blocks the
  # deploy rather than only being noticed later.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Actions are pinned by commit SHA: a mutable tag like @v4 lets an
        # upstream compromise run arbitrary code with this workflow's token.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job token is not left in .git/config, where npm ci's install
          # scripts and anything else in the job could read it.
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify package signatures and provenance
        # Checks the registry signatures (and attestations, where published)
        # of everything npm ci just installed.
        run: npm audit signatures
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unused files and exports
        # knip: anything exported that nothing imports fails the build, so dead
        # code does not quietly come back (knip.json says what counts).
        run: npm run knip
      - name: Unit tests
        run: npm test
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Bundle budgets
        # The e2e servers have just built dist/, so this only measures it.
        run: npm run budgets
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The PWA in Safari (desktop and iPhone) and Firefox, where storage
  # eviction and IndexedDB quirks actually bite. A job of its own so its
  # browser downloads do not hold up the other checks; the deploy still waits
  # for it. The Android app is always Chromium, so its project is not run here.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install WebKit and Firefox
        run: npx playwright install --with-deps webkit firefox
      - name: End-to-end tests in Safari and Firefox
        env:
          E2E_ALL_BROWSERS: '1'
        run: >-
          npx playwright test
          --project=desktop-webkit
          --project=mobile-webkit
          --project=desktop-firefox
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-browsers
          path: playwright-report
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [verify, browsers]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job token is not left in .git/config, where npm ci's install
          # scripts and anything else in the job could read it.
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Publishing keeps the single site-wide slot, but queues instead of
    # cancelling: two deploys racing for the same Pages site clobber each other.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
