name: Android app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A signed Google Play build is only ever made on request: Actions → Android
  # app → Run workflow. Every Play upload needs a new versionCode and uses the
  # upload key, so neither happens as a side effect of a merge.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Standard GitHub-hosted runners are free for public repositories; larger
    # runners are billed even here. Keep every job on ubuntu-latest.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Actions are pinned by commit SHA: a mutable tag like @v4 lets an
        # upstream compromise run arbitrary code with this workflow's token.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        # Also checks android/gradle/wrapper/gradle-wrapper.jar against
        # Gradle's published checksums before anything runs it.
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          # Open-source caching on the Actions cache, not the default
          # commercial caching service.
          cache-provider: basic
      - name: Install dependencies
        run: npm ci
      - name: Build the Android web bundle
        run: npm run build:android
      - name: Copy it into the Android project
        run: npx cap sync android
      - name: Lint, unit-test and build
        working-directory: android
        run: ./gradlew lintRelease testReleaseUnitTest assembleDebug bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: butterfly-garden-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-release.html
          retention-days: 7

  release:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The upload key lives only in this environment's secrets. Restrict the
    # environment to the main branch (and optionally require your approval)
    # in Settings → Environments → play-release.
    environment: play-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-provider: basic
          # A release build restores the cache but never writes to it.
          cache-read-only: true
      - name: Install dependencies
        run: npm ci
      - name: Build the Android web bundle
        run: npm run build:android
      - name: Copy it into the Android project
        run: npx cap sync android
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.BG_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The play-release environment has no BG_UPLOAD_KEYSTORE_BASE64 secret. See docs/android-play-plan.md."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "BG_UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build signed bundle and APK
        working-directory: android
        env:
          BG_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.BG_UPLOAD_KEYSTORE_PASSWORD }}
          BG_UPLOAD_KEY_ALIAS: ${{ secrets.BG_UPLOAD_KEY_ALIAS }}
          BG_UPLOAD_KEY_PASSWORD: ${{ secrets.BG_UPLOAD_KEY_PASSWORD }}
        # The run number only ever grows, so each signed build gets a
        # versionCode Google Play has not seen.
        run: ./gradlew bundleRelease assembleRelease -PversionCode=${{ github.run_number }}
      - name: Check the signatures
        working-directory: android/app/build/outputs
        # jarsigner exits 0 even for an unsigned bundle ("jar is unsigned."),
        # so the verdict line itself is what gets checked. Its warnings about
        # a self-signed certificate are expected for an upload key.
        run: |
          jarsigner -verify bundle/release/app-release.aab | grep -x 'jar verified.'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs apk/release/app-release.apk
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Upload signed bundle and APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: butterfly-garden-play-release-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
