name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly as well, so a newly published CodeQL query or a newly known-bad
  # action reaches this repository even in a quiet week.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To upload results to the repository's Security tab.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # TypeScript and JavaScript are analysed from source; nothing to build.
          languages: javascript-typescript
          build-mode: none
      - name: Analyse
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Findings fail this job and print in its log, rather than going to
          # code scanning, so a risky workflow change is caught on its own PR.
          advanced-security: false
          version: 1.31.1
