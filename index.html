<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/The-Butterfly-Garden/icons/favicon-64.png" />
    <!-- iOS takes its home-screen icon from here, not from the manifest. -->
    <link rel="apple-touch-icon" href="/The-Butterfly-Garden/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07131f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A private, gentle self-care garden that grows with you." />

    <!-- The garden makes no network requests of its own: scripts, styles,
         fonts and images all come from this origin, and nothing may be sent
         anywhere. Typography is bundled (see src/fonts.css) rather than
         fetched from a font CDN, so no third party ever sees a visit. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />

    <title>The Butterfly Garden</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
